<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian · Launcher, desktop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..700&display=swap">
<style>

:root {
  color-scheme: dark;
  --color-bg:            oklch(15% 0.014 65);
  --color-surface:       oklch(19% 0.014 65);
  --color-surface-2:     oklch(23% 0.016 65);
  --color-border:        oklch(30% 0.016 65);
  --color-border-strong: oklch(40% 0.020 65);
  --color-text:          oklch(93% 0.010 75);
  --color-text-dim:      oklch(64% 0.014 70);
  --color-text-faint:    oklch(52% 0.012 70);
  --color-accent:        oklch(78% 0.10 205);
  --color-accent-strong: oklch(68% 0.11 205);
  --color-accent-soft:   color-mix(in srgb, var(--color-accent) 16%, transparent);
  --color-on-accent:     oklch(20% 0.03 205);
  --status-ok:       oklch(76% 0.12 160);
  --status-degraded: oklch(80% 0.14 85);
  --status-down:     oklch(68% 0.17 25);
  --status-unknown:  oklch(58% 0.010 65);
  --status-disabled: oklch(52% 0.012 70);
  --down-soft: color-mix(in srgb, var(--status-down) 11%, transparent);
  --warn-soft: color-mix(in srgb, var(--status-degraded) 11%, transparent);
  --font-ui: 'Lexend', 'Lexend Variable', system-ui, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --fs-vital: 22px; --fs-name: 15px; --fs-meta: 12px;
  --radius: 10px; --touch: 44px;
}
.screen *, .screen *::before, .screen *::after { box-sizing: border-box; }
.screen { container-type: inline-size; background: var(--color-bg); color: var(--color-text); font-family: var(--font-ui); font-size: 15px; line-height: 1.4; min-height: inherit; -webkit-font-smoothing: antialiased; }
.screen a { color: inherit; text-decoration: none; }
.screen h1, .screen h2, .screen h3, .screen p, .screen ul, .screen ol { margin: 0; padding: 0; }
.screen ul, .screen ol { list-style: none; }
.screen button { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.screen :focus-visible, .is-focus { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.tnum, .countdown, .tile .vital, time { font-variant-numeric: tabular-nums; }

.page { display: flex; flex-direction: column; gap: 28px; max-width: 1120px; margin: 0 auto; padding: 20px 16px 36px; }

/* status marks */
.st { display: inline-flex; align-items: center; justify-content: center; flex: none; }
.st-ok { color: var(--status-ok); } .st-degraded { color: var(--status-degraded); }
.st-down { color: var(--status-down); } .st-unknown { color: var(--status-unknown); } .st-disabled { color: var(--status-disabled); }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--touch); }
.brand { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 600; letter-spacing: -0.015em; }
.brand .logo { color: var(--color-accent); flex: none; }
.summary { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.summary strong { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--color-text); }
.summary small { font-size: var(--fs-meta); color: var(--color-text-dim); }
.summary .wide { display: none; }

/* search */
.search { display: grid; gap: 10px; max-width: 560px; width: 100%; }
.field { position: relative; display: block; }
.field .lead { position: absolute; left: 14px; top: 50%; translate: 0 -50%; color: var(--color-text-dim); pointer-events: none; }
.field input { width: 100%; height: 48px; padding: 0 14px 0 44px; font: inherit; font-size: 16px; color: var(--color-text); background: var(--color-surface); border: 1px solid var(--color-border-strong); border-radius: var(--radius); }
.field input::placeholder { color: var(--color-text-dim); opacity: 1; }
.field input::-webkit-search-cancel-button { display: none; }
.search-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: var(--touch); padding: 8px 14px; font-size: 14px; font-weight: 450; line-height: 1.2; text-align: center; background: var(--color-surface-2); border: 1px solid var(--color-border-strong); border-radius: 8px; cursor: pointer; }
.btn:hover:not(:disabled) { background: color-mix(in srgb, var(--color-surface-2) 80%, var(--color-text) 8%); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn small { font-size: 11px; font-weight: 400; color: var(--color-text-dim); }
.search-actions .btn { flex-direction: row; gap: 8px; min-height: 48px; font-size: 15px; font-weight: 500; border-radius: var(--radius); }
.btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-on-accent); font-weight: 550; }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--color-accent) 88%, white); }
.btn.danger { background: transparent; border-color: var(--status-down); color: var(--status-down); }
.btn.danger:hover { background: var(--down-soft); }
.btn.done { color: var(--status-ok); border-color: color-mix(in srgb, var(--status-ok) 45%, var(--color-border)); background: color-mix(in srgb, var(--status-ok) 9%, var(--color-surface-2)); flex-direction: row; gap: 6px; cursor: default; }
.btn.queued { color: var(--status-degraded); border-color: color-mix(in srgb, var(--status-degraded) 45%, var(--color-border)); background: var(--warn-soft); flex-direction: row; gap: 8px; cursor: default; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; flex: none; }
@keyframes pulse { 50% { opacity: 0.25; } }

/* sections and tiles */
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec h2, .history h2, .host h2 { display: flex; align-items: baseline; gap: 10px; font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-dim); }
.count { font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--color-text-dim); font-variant-numeric: tabular-nums; }
.count::before { content: ''; }
.grid { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.tile { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; column-gap: 12px; row-gap: 10px; min-height: 92px; padding: 14px 16px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); }
a.tile:hover { background: var(--color-surface-2); border-color: var(--color-border-strong); }
.tile.static { background: transparent; }
.tile .name { display: flex; align-items: center; gap: 10px; min-height: 24px; font-size: var(--fs-name); font-weight: 500; }
.tile .name .ico { color: var(--color-text-dim); }
.tile .st { justify-self: end; min-height: 24px; }
.tile .desc { align-self: end; font-size: var(--fs-meta); color: var(--color-text-dim); line-height: 1.35; }
.tile .vital { grid-column: 2; justify-self: end; align-self: end; text-align: right; line-height: 1.1; white-space: nowrap; }
.tile .vital b { font-size: var(--fs-vital); font-weight: 500; letter-spacing: -0.01em; }
.tile .vital .unit { margin-left: 5px; font-size: var(--fs-meta); color: var(--color-text-dim); }
.tile .vital .age { display: block; margin-top: 3px; font-size: 11px; color: var(--color-text-dim); }
.tile .vital.aging b { color: var(--color-text-dim); }
.tile .vital.old b, .tile .vital.old .unit, .tile .vital.old .age { color: var(--color-text-faint); }
.tile .vital.note { font-size: var(--fs-meta); color: var(--color-text-dim); white-space: normal; max-width: 17ch; }
.tile-card { display: flex; flex-direction: column; overflow: hidden; background: var(--color-surface); border: 1px solid color-mix(in srgb, var(--status-down) 45%, var(--color-border)); border-radius: var(--radius); }
.tile-card .tile { flex: 1; background: transparent; border: 0; border-radius: 0; }
.tile-card a.tile:hover { background: var(--color-surface-2); }
.fix { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--touch); padding: 0 16px; background: var(--down-soft); border-top: 1px solid color-mix(in srgb, var(--status-down) 30%, var(--color-border)); font-size: 13px; }
.fix:hover { background: color-mix(in srgb, var(--status-down) 17%, transparent); }
.fix .why { color: var(--color-text-dim); }
.fix .go { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; color: var(--color-accent); }
.ctl-link { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; padding: 10px 16px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); }
.ctl-link:hover { background: var(--color-surface-2); border-color: var(--color-border-strong); }
.ctl-link span { display: flex; flex-direction: column; gap: 1px; }
.ctl-link b { font-weight: 500; }
.ctl-link small { font-size: var(--fs-meta); color: var(--color-text-dim); }
.ctl-link .ico { color: var(--color-accent); }

/* status key (reference) */
.keylist { display: grid; gap: 1px; background: var(--color-border); border: 1px solid var(--color-border); border-radius: var(--radius); overflow: hidden; }
.keylist li { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; background: var(--color-surface); }
.keylist li .st { margin-top: 1px; }
.keylist li div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.keylist li span:not(.st):not(.sr) { font-size: 13px; color: var(--color-text-dim); }

/* control */
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 8px; background: color-mix(in srgb, var(--color-bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--color-border); }
.bar .back { display: inline-flex; align-items: center; gap: 8px; min-height: var(--touch); padding: 0 10px; border-radius: 8px; color: var(--color-text-dim); font-size: 14px; }
.bar .back:hover { color: var(--color-text); background: var(--color-surface); }
.bar .crumb { color: var(--color-border-strong); margin-left: -4px; }
.bar h1 { font-size: 16px; font-weight: 600; }
.bar .brand.sm { font-size: 17px; padding-left: 10px; }
.ctl .page { padding-top: 16px; gap: 20px; }
.hostline { display: flex; flex-wrap: wrap; gap: 6px; font-size: var(--fs-meta); color: var(--color-text-dim); }
.ctl-grid { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.main { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
.rows { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 12px; overflow: hidden; }
.row { padding: 16px; border-top: 1px solid var(--color-border); scroll-margin-top: 72px; }
.row:first-child { border-top: 0; }
.row:target, .row.hl { background: var(--color-accent-soft); }
.row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.row-head h3 { font-size: 16px; font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 11px 0 8px; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: 999px; }
.row-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; font-size: 13px; color: var(--color-text-dim); }
.crit { margin-right: 4px; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; align-self: center; }
.crit-high { color: var(--color-text); }
.actions { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; margin-top: 14px; }
.actions .btn { flex: 1 1 88px; }
.actions .btn:disabled { flex: 1.7 1 112px; }
.actions.pair { margin-top: 12px; }
.actions.pair .btn { flex: 1 1 0; min-height: 48px; padding: 8px 10px; font-size: 15px; }
.row.armed { background: var(--down-soft); box-shadow: inset 0 0 0 1px var(--status-down); }
.row.stopped { background: var(--warn-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--status-degraded) 55%, var(--color-border)); }
.callout { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; margin-top: 12px; padding: 12px; font-size: 14px; line-height: 1.45; border-radius: 8px; }
.callout .ico { margin-top: 1px; }
.callout.danger { background: var(--down-soft); border: 1px solid color-mix(in srgb, var(--status-down) 50%, var(--color-border)); color: var(--color-text); }
.callout.danger .ico { color: var(--status-down); }
.callout.warn { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--status-degraded) 45%, var(--color-border)); }
.callout.warn .ico { color: var(--status-degraded); }
.arm { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 12px; color: var(--color-text-dim); font-variant-numeric: tabular-nums; }
.arm-bar { flex: 1; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--status-down) 22%, transparent); overflow: hidden; }
.arm-bar i { display: block; height: 100%; background: var(--status-down); animation: drain 5s linear infinite; }
@keyframes drain { from { width: 100%; } to { width: 0; } }
.arm span { white-space: nowrap; }
.count-wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 12px; }
.count-label { font-size: 13px; color: var(--color-text-dim); }
.countdown { font-size: 30px; font-weight: 500; letter-spacing: -0.02em; }

.host { display: flex; flex-direction: column; gap: 12px; padding-top: 28px; border-top: 1px solid var(--color-border); }
.host-card { padding: 16px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 12px; }
.host-card.armed { background: var(--down-soft); border-color: var(--status-down); }
.host-card h3 { font-size: 16px; font-weight: 500; }
.host-note { margin-top: 4px; font-size: 13px; color: var(--color-text-dim); }
.host-card .actions { margin-top: 14px; }
.host-card .actions .btn { flex: 0 1 148px; }
.host-card .actions.pair .btn { flex: 1 1 0; }

.history { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.hist { display: flex; flex-direction: column; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 12px; overflow: hidden; }
.screen .hg { padding: 12px 16px 6px; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-dim); }
.screen .hg:not(:first-child) { border-top: 1px solid var(--color-border); margin-top: 6px; }
.h { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 38px; padding: 6px 16px; font-size: 13px; border-left: 3px solid transparent; }
.h time { color: var(--color-text-dim); font-size: 12px; }
.h .what b { font-weight: 500; }
.h .res { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.h.fail { display: block; padding: 0; border-left-color: var(--status-down); background: var(--down-soft); }
.h.fail summary { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: var(--touch); padding: 6px 16px 6px 13px; cursor: pointer; list-style: none; }
.h.fail summary::-webkit-details-marker { display: none; }
.h.fail .res { color: var(--status-down); }
.h.fail pre { margin: 0; padding: 4px 16px 14px 13px; font: 12px/1.55 var(--font-mono); color: var(--color-text-dim); white-space: pre-wrap; overflow-wrap: anywhere; }
.h.pending { border-left-color: var(--status-degraded); }
.h.pending .res { color: var(--status-degraded); }

.banner { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; padding: 14px 16px; background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--status-degraded) 50%, var(--color-border)); border-radius: 12px; }
.banner .ico { color: var(--status-degraded); margin-top: 1px; }
.banner strong { font-size: 15px; font-weight: 550; }
.banner p { margin-top: 2px; font-size: 14px; }
.banner .hint { margin-top: 8px; font-size: 13px; color: var(--color-text-dim); }

/* rebooting */
.reboot .page { gap: 28px; padding-top: 32px; }
.hero { display: flex; flex-direction: column; gap: 10px; }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.hero h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }
.lede { color: var(--color-text-dim); }
.meter { height: 6px; margin-top: 10px; border-radius: 3px; background: var(--color-surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--color-accent); border-radius: 3px; }
.clock { display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: var(--color-text-dim); }
.clock .tnum { font-size: 22px; font-weight: 500; color: var(--color-text); }
.steps { display: flex; flex-direction: column; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 12px; overflow: hidden; }
.steps li { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-top: 1px solid var(--color-border); }
.steps li:first-child { border-top: 0; }
.steps li .st { margin-top: 1px; }
.steps li div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.steps li b { font-weight: 500; font-size: 14px; }
.steps li small { font-size: 12px; color: var(--color-text-dim); font-variant-numeric: tabular-nums; }
.steps li.now b { color: var(--color-accent); }
.foot-note { font-size: 13px; color: var(--color-text-dim); max-width: 52ch; }

/* adaptations, driven by the frame's own width */
@container (min-width: 768px) {
  .page { padding: 32px 32px 56px; gap: 36px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .summary .wide { display: inline; }
  .tile { min-height: 96px; }
  .brand { font-size: 24px; }
  .sec h2 { font-size: 12px; }
  .ctl-link { max-width: 560px; }
  .bar { padding: 0 24px; }
  .ctl .page { padding-top: 28px; }
  .reboot .page { max-width: 640px; }
}
@container (min-width: 1100px) {
  .ctl-grid { grid-template-columns: minmax(0, 1fr) 400px; gap: 40px; }
  .history { position: sticky; top: 84px; }
}
@container (min-width: 1200px) {
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  .pulse, .arm-bar i { animation: none; }
  .arm-bar i { width: 60%; }
}


:root { color-scheme: dark; --chrome-bg: oklch(11% 0.012 65); --chrome-text: oklch(80% 0.012 70); --chrome-dim: oklch(62% 0.014 70); }
body { margin: 0; background: var(--chrome-bg); color: var(--chrome-text); font-family: 'Lexend', 'Lexend Variable', system-ui, sans-serif; }
.stage { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 40px 36px; padding: 32px 16px 64px; }
.fig { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.fig.desk { width: 100%; align-items: center; }
.cap { font-size: 12px; letter-spacing: 0.02em; color: var(--chrome-dim); }
.frame { overflow: hidden; background: var(--color-bg); box-shadow: 0 0 0 1px oklch(30% 0.016 65), 0 24px 60px oklch(5% 0.01 65 / 0.6); }
.frame.phone { width: 390px; max-width: 100%; min-height: 844px; border-radius: 30px; }
.frame.desk { width: 1440px; min-height: 860px; border-radius: 12px; }
@media (max-width: 430px) {
  .stage { padding: 0; gap: 0; }
  .fig { width: 100%; gap: 0; }
  .cap { display: none; }
  .frame.phone { width: 100%; border-radius: 0; box-shadow: none; }
  .fig.phone ~ .fig.desk { display: none; }
}

</style>
</head>
<body>
<div class="stage">
<figure class="fig desk" style="margin:0"><figcaption class="cap">Default, 1440</figcaption><div class="frame desk"><div class="screen"><main class="page">
    <header class="top">
      <div class="brand"><svg class="logo" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/></svg><span>Meridian</span></div>
      <div class="summary">
        <strong class="st-ok"><span class="st st-ok"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="5.2" fill="currentColor"/></svg><span class="sr">all healthy</span></span><span>10/10 up</span></strong>
        <small>checked 8s ago<span class="wide"> · lepotato up 16d</span></small>
      </div>
    </header>
    <form class="search" role="search" onsubmit="return false">
      <label class="field" for="q-empty">
        <svg class="ico lead" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q-empty" type="search" placeholder="Search anything…" value="" autocomplete="off" enterkeyhint="search" class="">
      </label>

<script>
(function () {
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('.screen a');
    if (a) e.preventDefault();
  });
  document.querySelectorAll('.search').forEach(function (f) {
    var input = f.querySelector('input');
    var btns = f.querySelectorAll('.search-actions .btn');
    function sync() { btns.forEach(function (b) { b.disabled = input.value.trim() === ''; }); }
    input.addEventListener('input', sync);
    f.addEventListener('submit', function (e) { e.preventDefault(); });
  });
  document.querySelectorAll('[data-countdown]').forEach(function (el) {
    var left = parseInt(el.getAttribute('data-countdown'), 10);
    setInterval(function () {
      left = left > 0 ? left - 1 : 0;
      el.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    }, 1000);
  });
  function fit() {
    document.querySelectorAll('.frame.desk').forEach(function (fr) {
      var host = fr.parentElement;
      var w = host.parentElement.clientWidth - 32;
      if (!w) return;
      fr.style.zoom = Math.min(1, w / 1440);
    });
  }
  window.addEventListener('resize', fit);
  window.__fit = fit;
  fit();
})();
</script>
