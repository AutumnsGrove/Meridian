# The dashboard's compose file, installed at ~/Meridian/docker-compose.yml on the box.
#
# Host networking is not cosmetic: on a bridge network "localhost" inside the container is the
# container, and every probe would report the box as down (decision #26). Nothing is published and no
# socket is mounted. The container sees four read-only paths, plus two writable directories that are
# not even its own: the control inbox, where a request goes so the host can pick it up (decision #63),
# and the self-update signal, which the host re-validates before acting on it (decisions #20, #52). The
# invariants test in internal/invariants enforces that shape, so a change that widens it
# fails the build.
#
# The image reference comes from .env so the self-update can pin it by digest. The uid and gid are the
# deploy user's, so the status directory is writable without being world-writable.
#
# `restart: always` and `--watch` are a pair, and both are load-bearing (decision #100). Docker marks a
# container "manually stopped" for *any* signal sent through the kill API, including the
# `docker kill -s HUP` this project used to recommend for a reload. `unless-stopped` honours that flag
# at boot, so one reload would silently keep the dashboard down after the next reboot — which is how
# the box failed on 2026-11-01. `always` ignores the flag across a daemon start, and `--watch` means a
# config edit never needs the kill API at all.
services:
  meridian:
    image: ${MERIDIAN_IMAGE}
    container_name: meridian
    network_mode: host
    user: "${MERIDIAN_UID}:${MERIDIAN_GID}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: always
    command: ["--watch"]
    pids_limit: 64
    mem_limit: 128m
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "/meridian", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./icons:/config/icons:ro
      - ./status:/status:ro
      # The one writable mount: queued requests only. Results and the audit log are in outbox/, which
      # the executor writes and this container reads read-only.
      - ./control/inbox:/control/inbox
      - ./control/outbox:/control/outbox:ro
      # The self-update hint: the container writes the resolved digest here, the host re-validates it
      # against its own allowlist before pulling anything (decisions #20, #52).
      - ./update-signal:/update-signal
