name: release

# Push a digest-pinned multi-arch image to GHCR after CI is green on main, and cut a release with the
# host binary on a v* tag. Nothing is ever built on the potato: the box only pulls (decision #67).
#
# The image job runs on workflow_run because a push event would race the CI it should follow. The tag
# path is separate: a tag is cut from a green main, and its assets are the release, not an image tag.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: publish the image
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Require a green CI run for the tagged commit
        # The workflow_run path only fires after a green CI run; a pushed tag has no such guarantee.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --status success --json databaseId --jq length)
          if [ "$green" -lt 1 ]; then
            echo "::error::ci has no green run for ${GITHUB_SHA}; tag a commit that passed CI on main"
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # workflow_run's GITHUB_SHA is the default branch tip, not the commit CI just tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Choose the tag and the build stamps
        shell: bash
        env:
          REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            tag="latest"
            version="0.0.0-main-${REVISION:0:7}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${GITHUB_REF_NAME#v}"
          fi
          {
            echo "IMAGE_TAG=${tag}"
            echo "REVISION=${REVISION}"
            echo "VERSION=${version}"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >>"$GITHUB_ENV"
      - name: Build and push both architectures
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/autumnsgrove/meridian:${{ env.IMAGE_TAG }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.REVISION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest the image provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/autumnsgrove/meridian
          subject-digest: ${{ steps.build.outputs.digest }}
          push: true
      - name: Write the digest to the job summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### Meridian image"
            echo ""
            echo "- tag: \`ghcr.io/autumnsgrove/meridian:${IMAGE_TAG}\`"
            echo "- digest: \`${DIGEST}\`"
          } >>"$GITHUB_STEP_SUMMARY"

  host:
    name: release the host binary
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require a green CI run for the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --status success --json databaseId --jq length)
          if [ "$green" -lt 1 ]; then
            echo "::error::ci has no green run for ${GITHUB_SHA}; tag a commit that passed CI on main"
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build both host binaries and their checksums
        shell: bash
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build \
              -trimpath -buildvcs=false -ldflags "-s -w" \
              -o "dist/meridian-host-linux-${arch}" ./cmd/meridian-host
          done
          (cd dist && sha256sum meridian-host-linux-* >SHA256SUMS && cat SHA256SUMS)
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "Meridian ${GITHUB_REF_NAME}" --generate-notes
          fi
