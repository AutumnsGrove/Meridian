name: ci

# The gate the whole build relies on: every job calls the same scripts/check the pre-commit hook
# calls, so green locally means green here. Runs on the tip of a push to main and by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Put Go's bin directory on the path
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.1
      - name: Go checks
        run: scripts/check go

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Detect the frontend
        id: detect
        run: |
          set -euo pipefail
          if [ -f web/package.json ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Notice
        if: steps.detect.outputs.web == 'false'
        run: |
          echo "web checks skipped: web/package.json does not exist yet"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.detect.outputs.web == 'true'
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.web == 'true'
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web checks
        if: steps.detect.outputs.web == 'true'
        run: scripts/check web

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz every target for 20s
        env:
          FUZZ_TIME: 20s
        run: scripts/check fuzz

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Detect the frontend
        id: detect
        run: |
          set -euo pipefail
          if [ -f web/package.json ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f web/playwright.config.ts ]; then
            echo "playwright=true" >> "$GITHUB_OUTPUT"
          else
            echo "playwright=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Notice
        if: steps.detect.outputs.playwright == 'false'
        run: |
          echo "e2e skipped: the Playwright suite does not exist yet"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.detect.outputs.playwright == 'true'
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.playwright == 'true'
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.detect.outputs.playwright == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install browsers
        if: steps.detect.outputs.playwright == 'true'
        run: cd web && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: End-to-end checks
        if: steps.detect.outputs.playwright == 'true'
        run: scripts/check e2e

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Detect the frontend
        id: detect
        run: |
          set -euo pipefail
          if [ -f web/package.json ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the security tools
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          gitleaks_version=8.30.1
          gitleaks_archive="gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          mkdir -p "$HOME/.local/bin"
          # The archive keeps its release name: the checksum file lists that name, and sha256sum -c
          # reads the file it checks from the working directory.
          curl -sSfL -o "/tmp/${gitleaks_archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/${gitleaks_archive}"
          curl -sSfL -o /tmp/gitleaks-checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/gitleaks_${gitleaks_version}_checksums.txt"
          (cd /tmp && grep " ${gitleaks_archive}\$" gitleaks-checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${gitleaks_archive}" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.detect.outputs.web == 'true'
        with:
          version: 10
      - name: Security checks
        run: scripts/check security
