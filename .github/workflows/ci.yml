name: ci

# The gate the whole build relies on: every job calls the same scripts/check the pre-commit hook
# calls, so green locally means green here. Runs on the tip of a push to main and by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Put Go's bin directory on the path
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.1
      - name: Go checks
        run: scripts/check go

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect the frontend
        id: detect
        run: |
          set -euo pipefail
          if [ -f web/package.json ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Notice
        if: steps.detect.outputs.web == 'false'
        run: |
          echo "web checks skipped: web/package.json does not exist yet"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.detect.outputs.web == 'true'
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.web == 'true'
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web checks
        if: steps.detect.outputs.web == 'true'
        run: scripts/check web

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz every target for 20s
        env:
          FUZZ_TIME: 20s
        run: scripts/check fuzz

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The suite builds the binary and the stub upstream, so it needs the same Go the other jobs use.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install browsers
        run: cd web && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: End-to-end checks
        run: scripts/check e2e

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The container driver is what can build two architectures without pushing either of them.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image for both architectures
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=0.0.0-ci" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .
      - name: Build the amd64 image the scan and the smoke test use
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --build-arg "VERSION=0.0.0-ci" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            --cache-from type=gha \
            -t meridian:ci \
            .
      # A HIGH or CRITICAL finding fails the job. Unfixed findings are reported but do not fail it: a
      # base-image CVE with no patched release is not something this repo can act on, and a gate that
      # cannot be satisfied gets deleted.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: meridian:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Smoke test the image
        run: scripts/smoke-image meridian:ci

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Detect the frontend
        id: detect
        run: |
          set -euo pipefail
          if [ -f web/package.json ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the security tools
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          gitleaks_version=8.30.1
          gitleaks_archive="gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          mkdir -p "$HOME/.local/bin"
          # The archive keeps its release name: the checksum file lists that name, and sha256sum -c
          # reads the file it checks from the working directory.
          curl -sSfL -o "/tmp/${gitleaks_archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/${gitleaks_archive}"
          curl -sSfL -o /tmp/gitleaks-checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/gitleaks_${gitleaks_version}_checksums.txt"
          (cd /tmp && grep " ${gitleaks_archive}\$" gitleaks-checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${gitleaks_archive}" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.detect.outputs.web == 'true'
        with:
          version: 10
      - name: Security checks
        run: scripts/check security
